<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Paidiasophia</title>
    <meta
      name="description"
      content="A research wiki dedicated to the study of play."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="174x174"
      href="./assets/favicon.png?v=20260814-nesting-doll-proportional"
    />
    <link
      rel="apple-touch-icon"
      sizes="174x174"
      href="./assets/favicon.png?v=20260814-nesting-doll-proportional"
    />
    <link rel="stylesheet" href="./src/styles.css?v=20260924-quote-viewer-wrapping" />
  </head>
  <body class="page--spreadsheet">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <p class="sidebar__eyebrow">research wiki</p>
        <h1><a class="sidebar__home" id="site-home-link" href="./">Paidiasophia</a></h1>
      </div>
      <nav class="sidebar__nav" id="site-nav"></nav>
      <div class="sidebar__status" id="site-status"></div>
    </aside>
    <button
      class="sidebar-backdrop"
      id="sidebar-backdrop"
      type="button"
      aria-label="Close menu"
    ></button>

    <div class="site-shell">
      <main class="page">
        <div class="page__menu-pin">
          <button
            class="page__menu"
            id="menu-toggle"
            type="button"
            aria-label="Open menu"
          >
            <img src="./assets/favicon.png" alt="" />
          </button>
        </div>
        <header class="page__header">
          <div class="page__trail">
            <a class="page__breadcrumb-up" id="breadcrumb-up" href="#/" aria-label="Go up one level">←</a>
            <div class="page__breadcrumbs" id="breadcrumbs"></div>
          </div>
        </header>
        <div class="page__header-rule" aria-hidden="true"></div>

        <section class="hero" id="page-hero"></section>
        <article class="page__content" id="page-content"></article>
      </main>

      <aside
        class="book-preview-panel"
        id="book-preview-panel"
        aria-label="Book preview"
        aria-hidden="true"
      >
        <header class="book-preview-panel__header">
          <a
            class="book-preview-panel__open-page"
            id="book-preview-open-page"
            aria-label="Open preview as a full page"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9 4H4v5"></path>
              <path d="M15 4h5v5"></path>
              <path d="M20 15v5h-5"></path>
              <path d="M4 15v5h5"></path>
            </svg>
          </a>
          <button
            class="book-preview-panel__close"
            id="book-preview-close"
            type="button"
            aria-label="Close book preview"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m7 7 10 10"></path>
              <path d="m17 7-10 10"></path>
            </svg>
          </button>
        </header>
        <section class="hero book-preview-panel__hero" id="book-preview-hero"></section>
        <article
          class="page__content page__content--book book-preview-panel__content"
          id="book-preview-content"
          aria-live="polite"
        ></article>
      </aside>
    </div>

    <template id="page-card-template">
      <a class="page-card">
        <span class="page-card__icon"></span>
        <span class="page-card__body">
          <span class="page-card__title"></span>
          <span class="page-card__meta">open page</span>
        </span>
      </a>
    </template>

    <script type="module" src="./src/app.js?v=20260924-quote-viewer-wrapping"></script>
  </body>
</html>
